# Model servers (ADR-016): one vLLM pod per GPU node, each with a full GPU (gpu-full-mode.sh) and its weights on
# node-local `scratch` storage. A pod's PVC binds to the node it first lands on, so model-N stays on that node.
# Model and engine flags come from the WP-02 benchmark (ADR-023); change them in the ConfigMap, then
# `kubectl -n codehaunt rollout restart statefulset/model`.
apiVersion: v1
kind: ConfigMap
metadata: {name: model-config, namespace: codehaunt}
data:
  model: Qwen/Qwen3-4B-Instruct-2507-FP8
  # Pinned Hugging Face commit. Weights are fetched once per node; a marker written after a complete download
  # stops re-fetching (an interrupted download is resumed on the next start, audit run-6 N3).
  revision: 8591804019c8b22094c3b5b4454e0edc05dffc98
  # Extra vLLM flags for this model (quantisation etc.).
  extraArgs: --kv-cache-dtype fp8
  # Read by the gateway; `{}` when the model needs none.
  chatTemplateKwargs: ''
---
# vLLM checks VLLM_API_KEY only on /v1, /v2, /inference and /cohere; /invocations and /tokenize generate or count
# without it (audit run-6 M3). This ASGI middleware requires the key on every HTTP and WebSocket path except the
# probe and scrape endpoints.
apiVersion: v1
kind: ConfigMap
metadata: {name: model-auth, namespace: codehaunt}
data:
  codehaunt_auth.py: |
    import hmac
    import os

    _EXPECTED = b"Bearer " + os.environ["CODEHAUNT_MODEL_KEY"].encode()
    _OPEN = {"/health", "/metrics"}


    class RequireKey:
        def __init__(self, app):
            self.app = app

        async def __call__(self, scope, receive, send):
            if scope["type"] in ("http", "websocket") and scope["path"] not in _OPEN:
                given = b""
                for name, value in scope["headers"]:
                    if name == b"authorization":
                        given = value
                if not hmac.compare_digest(given, _EXPECTED):
                    if scope["type"] == "http":
                        await send({"type": "http.response.start", "status": 401,
                                    "headers": [(b"content-type", b"application/json")]})
                        await send({"type": "http.response.body", "body": b'{"error":"unauthorized"}'})
                    else:
                        await send({"type": "websocket.close", "code": 1008})
                    return
            await self.app(scope, receive, send)
---
apiVersion: v1
kind: Service
metadata: {name: model, namespace: codehaunt, labels: {app: model}}
spec:
  clusterIP: None
  selector: {app: model}
  ports: [{name: http, port: 8000}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: model, namespace: codehaunt}
spec:
  serviceName: model
  replicas: 4
  podManagementPolicy: Parallel
  selector: {matchLabels: {app: model}}
  template:
    metadata: {labels: {app: model}}
    spec:
      runtimeClassName: nvidia
      nodeSelector: {nvidia.com/device-plugin.config: full}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector: {matchLabels: {app: model}}
            topologyKey: kubernetes.io/hostname
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      # Non-root (audit M3). fsGroup makes the node-local weights volume writable for uid 1000.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        # Ignore the image's /etc/group (its uid-1000 user is in sudo/adm).
        supplementalGroupsPolicy: Strict
        seccompProfile: {type: RuntimeDefault}
      initContainers:
      - name: fetch-weights
        image: docker.io/vllm/vllm-openai:v0.33.0@sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e
        command: ["bash", "-c"]
        args:
        - >-
          M="/models/.complete-${MODEL//\//--}-$REVISION";
          [ -f "$M" ] || { hf download "$MODEL" --revision "$REVISION" --quiet && touch "$M"; }
        env:
        - {name: HF_HOME, value: /models/hf}
        - {name: HOME, value: /models/home}
        - {name: MODEL, valueFrom: {configMapKeyRef: {name: model-config, key: model}}}
        - {name: REVISION, valueFrom: {configMapKeyRef: {name: model-config, key: revision}}}
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
        volumeMounts: [{name: models, mountPath: /models}, {name: tmp, mountPath: /tmp}]
      containers:
      - name: vllm
        image: docker.io/vllm/vllm-openai:v0.33.0@sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e
        command: ["bash", "-c"]
        args:
        - >-
          exec vllm serve "$MODEL" --revision "$REVISION" --served-model-name junior --host 0.0.0.0 --port 8000
          --max-model-len 10240 --gpu-memory-utilization 0.90 --max-num-seqs 16 --enable-prefix-caching
          --disable-log-requests --middleware codehaunt_auth.RequireKey $EXTRA_ARGS
        env:
        - {name: HF_HOME, value: /models/hf}
        - {name: HF_HUB_OFFLINE, value: "1"}
        - {name: HOME, value: /models/home}
        # Only the gateway holds this key; without it a shell on a GPU node could use the model unmetered (audit M3).
        - {name: VLLM_API_KEY, valueFrom: {secretKeyRef: {name: model-api-key, key: key}}}
        - {name: CODEHAUNT_MODEL_KEY, valueFrom: {secretKeyRef: {name: model-api-key, key: key}}}
        - {name: PYTHONPATH, value: /opt/codehaunt}
        - {name: MODEL, valueFrom: {configMapKeyRef: {name: model-config, key: model}}}
        - {name: REVISION, valueFrom: {configMapKeyRef: {name: model-config, key: revision}}}
        - {name: EXTRA_ARGS, valueFrom: {configMapKeyRef: {name: model-config, key: extraArgs}}}
        ports: [{name: http, containerPort: 8000}]
        startupProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5, failureThreshold: 120}
        readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5, failureThreshold: 2}
        livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10, failureThreshold: 6}
        resources:
          limits: {nvidia.com/gpu: 1, memory: 20Gi}
          requests: {cpu: "6", memory: 12Gi}
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
        volumeMounts:
        - {name: models, mountPath: /models}
        - {name: shm, mountPath: /dev/shm}
        - {name: tmp, mountPath: /tmp}
        - {name: auth, mountPath: /opt/codehaunt, readOnly: true}
      volumes:
      - name: auth
        configMap: {name: model-auth}
      - name: shm
        emptyDir: {medium: Memory, sizeLimit: 4Gi}
      - name: tmp
        emptyDir: {sizeLimit: 8Gi}
  volumeClaimTemplates:
  - metadata: {name: models}
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: scratch
      resources: {requests: {storage: 60Gi}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: model, namespace: codehaunt}
spec:
  maxUnavailable: 1
  selector: {matchLabels: {app: model}}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: {name: model, namespace: codehaunt}
spec:
  selector: {matchLabels: {app: model}}
  endpoints: [{port: http, path: /metrics, interval: 15s}]
