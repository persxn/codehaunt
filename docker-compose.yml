# Canonical way to run CodeHaunt (ADR-017). Profiles: core (this WP); inference, monitoring, tunnel come later.
# core services: migrate, web, worker, docker-proxy
#
# Networks (ADR-019): `db` and `sandbox` are internal (no route out of Docker). The worker sits only on those two,
# so even a compromised worker cannot reach the tailnet, gpu-master or the internet. Only the docker-proxy holds
# the host Docker socket. web and worker connect to Postgres as codehaunt_web / codehaunt_worker, never as the owner
# (audit F2, N5). Every service has memory and process caps (audit N4).
name: codehaunt

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
  pids_limit: 256

services:
  postgres:
    profiles: [core, db]
    image: postgres@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codehaunt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-codehaunt}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    networks: [db, edge]
    mem_limit: 4g
    pids_limit: 512
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *hardened
    profiles: [core]
    build:
      context: .
      dockerfile: packages/db/Dockerfile.migrate
    image: codehaunt-migrate:dev
    environment:
      # Owner credentials: the only service that holds them.
      DATABASE_URL: postgresql://${POSTGRES_USER:-codehaunt}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-codehaunt}
      WEB_DB_PASSWORD: ${WEB_DB_PASSWORD:?set WEB_DB_PASSWORD in .env}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?set WORKER_DB_PASSWORD in .env}
    tmpfs: [/tmp, /home/node]
    mem_limit: 512m
    networks: [db]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    <<: *hardened
    profiles: [core]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: codehaunt-web:dev
    environment:
      DATABASE_URL: postgresql://codehaunt_web:${WEB_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-codehaunt}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      # Inference gateway (ADR-022): the web API is its only client. Reached over the host's tailnet via the edge network.
      GATEWAY_URL: ${GATEWAY_URL:-}
      GATEWAY_FALLBACK_URL: ${GATEWAY_FALLBACK_URL:-}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:-}
      # SEB check for participants (ADR-013): both or neither; neither = localhost, not enforced.
      SEB_CONFIG_KEY: ${SEB_CONFIG_KEY:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
    tmpfs: [/tmp, /app/apps/web/.next/cache]
    mem_limit: 2g
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3100"
    networks: [db, edge]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    <<: *hardened
    profiles: [core]
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: codehaunt-worker:dev
    environment:
      DATABASE_URL: postgresql://codehaunt_worker:${WORKER_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-codehaunt}
      RUNNER_IMAGE: ${RUNNER_IMAGE:-codehaunt-runner:1}
      DOCKER_HOST: tcp://docker-proxy:2375
      # ≤ 16: the docker-proxy refuses more concurrent sandboxes (ADR-019).
      JUDGE_CONCURRENCY: ${JUDGE_CONCURRENCY:-8}
    tmpfs: [/tmp, /home/node]
    mem_limit: 1g
    networks: [db, sandbox]
    depends_on:
      migrate:
        condition: service_completed_successfully
      docker-proxy:
        condition: service_healthy
    restart: unless-stopped

  docker-proxy:
    <<: *hardened
    profiles: [core]
    build:
      context: .
      dockerfile: apps/docker-proxy/Dockerfile
    image: codehaunt-docker-proxy:dev
    environment:
      RUNNER_IMAGE: ${RUNNER_IMAGE:-codehaunt-runner:1}
    volumes:
      # Root-equivalent. Only this service mounts it; it rebuilds every create from the sandbox template.
      - "/var/run/docker.sock:/var/run/docker.sock"
    group_add:
      - "${DOCKER_GID:-999}"
    networks: [sandbox]
    mem_limit: 256m
    pids_limit: 64
    restart: unless-stopped

networks:
  db:
    internal: true
  sandbox:
    internal: true
  edge: {}

volumes:
  pgdata:
