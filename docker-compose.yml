# Canonical way to run CodeHaunt (ADR-017). Profiles: core (this WP); inference, monitoring, tunnel come later.
# core services: migrate, web, worker
name: codehaunt

services:
  postgres:
    profiles: [core, db]
    image: postgres@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codehaunt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-codehaunt}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    profiles: [core]
    build:
      context: .
      dockerfile: packages/db/Dockerfile.migrate
    image: codehaunt-migrate:dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-codehaunt}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-codehaunt}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    profiles: [core]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: codehaunt-web:dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-codehaunt}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-codehaunt}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3100"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    profiles: [core]
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: codehaunt-worker:dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-codehaunt}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-codehaunt}
      RUNNER_IMAGE: ${RUNNER_IMAGE:-codehaunt-runner:1}
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock" # grants control of the host Docker daemon; used by vendored judge to start sandbox containers
    group_add:
      - "${DOCKER_GID:-999}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
